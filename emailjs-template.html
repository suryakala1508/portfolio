<!--
  Paste this into EmailJS: Email Templates → your template → "Code Editor" (</> icon).
  Variables used: {{from_name}}, {{from_email}}, {{message}}
  Also set in the template's settings tab:
    To Email:    beesettisuryakala@gmail.com
    Reply To:    {{from_email}}   (so hitting "Reply" answers the visitor directly)
    Subject:     New portfolio message from {{from_name}}
-->
<div style="margin:0; padding:32px 16px; background-color:#0a1628; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px; margin:0 auto;">
    <tr>
      <td style="border-radius:20px 20px 0 0; padding:28px 32px; background:linear-gradient(135deg,#1e40af,#10b981);">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
          <tr>
            <td style="font-size:20px; font-weight:800; color:#ffffff; letter-spacing:0.02em;">
              SB<span style="color:#0a1628;">.</span>
            </td>
            <td align="right" style="font-size:12px; font-weight:600; color:rgba(255,255,255,0.85); text-transform:uppercase; letter-spacing:0.08em;">
              New Contact Message
            </td>
          </tr>
        </table>
      </td>
    </tr>

    <tr>
      <td style="background-color:#0f2038; padding:32px; border-left:1px solid #1b2f4d; border-right:1px solid #1b2f4d;">
        <p style="margin:0 0 24px; font-size:14px; line-height:1.6; color:#9aa7bd;">
          Someone just reached out through your portfolio's contact form.
        </p>

        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:16px;">
          <tr>
            <td style="padding:16px 20px; background-color:#0a1628; border:1px solid #1b2f4d; border-radius:12px;">
              <p style="margin:0 0 4px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:#34d399;">Name</p>
              <p style="margin:0; font-size:15px; color:#e8eef5;">{{from_name}}</p>
            </td>
          </tr>
        </table>

        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:16px;">
          <tr>
            <td style="padding:16px 20px; background-color:#0a1628; border:1px solid #1b2f4d; border-radius:12px;">
              <p style="margin:0 0 4px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:#34d399;">Email</p>
              <p style="margin:0; font-size:15px;">
                <a href="mailto:{{from_email}}" style="color:#3b82f6; text-decoration:none;">{{from_email}}</a>
              </p>
            </td>
          </tr>
        </table>

        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
          <tr>
            <td style="padding:16px 20px; background-color:#0a1628; border:1px solid #1b2f4d; border-radius:12px;">
              <p style="margin:0 0 4px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:#34d399;">Message</p>
              <p style="margin:0; font-size:15px; line-height:1.6; color:#e8eef5; white-space:pre-wrap;">{{message}}</p>
            </td>
          </tr>
        </table>

        <table role="presentation" cellpadding="0" cellspacing="0" style="margin-top:28px;">
          <tr>
            <td style="border-radius:8px; background-color:#1e40af;">
              <a href="mailto:{{from_email}}" style="display:inline-block; padding:12px 24px; font-size:14px; font-weight:700; color:#ffffff; text-decoration:none;">
                Reply to {{from_name}}
              </a>
            </td>
          </tr>
        </table>
      </td>
    </tr>

    <tr>
      <td style="border-radius:0 0 20px 20px; padding:20px 32px; background-color:#0a1628; border:1px solid #1b2f4d; border-top:none; text-align:center;">
        <p style="margin:0; font-size:12px; color:#6b7787;">Sent from your portfolio's contact form</p>
      </td>
    </tr>
  </table>
</div>
