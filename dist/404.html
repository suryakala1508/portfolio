<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found · Suryakala Beesetti</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f8fafc;
        --surface: #ffffff;
        --text: #0f172a;
        --text-secondary: #475569;
        --border: rgba(15, 23, 42, 0.1);
        --accent: #2563eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1120;
          --surface: #121a2c;
          --text: #e7ebf3;
          --text-secondary: #9aa7bd;
          --border: rgba(226, 232, 240, 0.1);
          --accent: #3b82f6;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
      }
      .card {
        max-width: 28rem;
        margin: 1.5rem;
        padding: 2.5rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        text-align: left;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      }
      h1 {
        font-size: 3rem;
        font-weight: 800;
        margin: 0 0 0.5rem;
        color: var(--accent);
      }
      p {
        line-height: 1.6;
        color: var(--text-secondary);
      }
      a {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        margin-top: 1.5rem;
        padding: 0.7rem 1.4rem;
        background: var(--accent);
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.875rem;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>404</h1>
      <p>This page doesn't exist. The link may be outdated, or the page moved. Head back to the home page.</p>
      <a href="/">&larr; Back to portfolio</a>
    </main>
  </body>
</html>
